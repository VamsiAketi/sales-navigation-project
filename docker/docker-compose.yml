services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "8900:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://paperclip:paperclip@db:5432/paperclip
      PORT: "3100"
      NODE_ENV: "production"
      HOME: "/paperclip"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_INSTANCE_ID: "default"
      PAPERCLIP_ONBOARD_AUTO_RUN: "false"
      PAPERCLIP_CONFIG: "/paperclip/instances/default/config.json"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "iZiDCE3TANXA/ZFEHObBlpxnIqOyEqil9YVwnU6duMM="
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - paperclip-data:/paperclip
      - ./bootstrap-output:/bootstrap-output 
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c '
      if [ -n "${OPENAI_API_KEY:-}" ]; then
        printenv OPENAI_API_KEY | codex login --with-api-key;
      else
        echo "OPENAI_API_KEY is not set; skipping codex login.";
      fi;
      if [ ! -f "${PAPERCLIP_CONFIG:-/paperclip/instances/default/config.json}" ]; then
        echo "=== WAITING FOR 30 SECONDS ===";
        sleep 30;
        echo "=== WAITING FOR 30 SECONDS DONE ===";
        echo "=== ONBOARDING PAPERCLIP INSTANCE ===";
        pnpm paperclipai onboard --yes;
        echo "=== STARTING SERVER FOR BOOTSTRAP ===";
        pnpm --filter @paperclipai/server dev &
        echo "Waiting for server (max 60s)...";
        ATTEMPTS=0;
        until curl -sf http://localhost:3100/api/health > /dev/null 2>&1; do
          ATTEMPTS=$((ATTEMPTS + 1));
          if [ "$ATTEMPTS" -ge 30 ]; then
            echo "Server did not become healthy within 60s, aborting bootstrap.";
            exit 1;
          fi;
          echo "Waiting for server... (${ATTEMPTS}/30)";
          sleep 2;
        done;
        echo "=== BOOTSTRAPPING ADMIN (CEO) ===";
        pnpm paperclipai auth bootstrap-ceo --data-dir /paperclip --base-url "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}";
        echo "=== BOOTSTRAP DONE ===";
        wait;
      else
        echo "Config ${PAPERCLIP_CONFIG:-/paperclip/instances/default/config.json} exists; skipping onboarding/bootstrap.";
        echo "=== VERIFYING ADMIN (CEO) BOOTSTRAP STATE ===";
        pnpm paperclipai auth bootstrap-ceo --data-dir /paperclip --base-url "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}";
        echo "=== ADMIN (CEO) BOOTSTRAP CHECK DONE ===";
        pnpm --filter @paperclipai/server dev;
      fi
      '
volumes:
  pgdata:
  paperclip-data:
