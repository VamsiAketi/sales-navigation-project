# Default values for paperclip.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# -- PostgreSQL database
# Set enabled: true ONLY for local development (spins up an in-cluster Postgres pod).
# For all Azure deployments (dev + tenants) keep enabled: false and supply
# server.database.externalUrl pointing to the shared Azure PostgreSQL Flexible Server.
postgres:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: paperclip
    password: paperclip
    database: paperclip
  persistence:
    size: 10Gi
    storageClass: ""  # Use default storage class if empty

# -- Paperclip server application
server:
  replicaCount: 1
  nodeName: ""
  image:
    # Build from project root: docker build -t <your-registry>/paperclip:latest .
    # Image must include git and @openai/codex (Dockerfile already does)
    repository: paperclip
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  serveUi: "true"
  persistence:
    size: 10Gi
    storageClass: "azurefile-csi"  # ReadWriteMany via Azure Files CSI driver — survives cluster deletion
  paperclip:
    instanceId: default
    deploymentMode: authenticated
    deploymentExposure: private
    publicUrl: https://dev-test.app.ai-harness.com
    # Optional: API keys for AI adapters (Codex, Claude). Leave empty to skip.
    openaiApiKey: ""
    anthropicApiKey: ""
  secrets:
    # Required for authenticated mode. Generate with: openssl rand -base64 32
    # In CI/CD this is injected via --set-string server.secrets.betterAuthSecret from BETTER_AUTH_SECRET GitHub secret.
    betterAuthSecret: "CHANGE_ME_use_openssl_rand_base64_32"
    # Optional but strongly recommended on Kubernetes: master key for local_encrypted company secrets
    # (see docs/deploy/secrets.md). Without this, the server defaults to data/secrets/master.key under
    # the container WORKDIR (/app), which is NOT on the /paperclip PVC — restarts/reschedules can break decryption.
    # Generate once per tenant and store in GitHub/Azure Key Vault: openssl rand -base64 32
    paperclipSecretsMasterKey: ""
  # -- External database URL (used when postgres.enabled: false)
  # For Azure deployments this is set per-tenant by the pipeline, e.g.:
  #   postgresql://postgres:<password>@ai-harness-pg-db.postgres.database.azure.com:5432/ai-harness-<tenant>?sslmode=require
  database:
    externalUrl: ""
  # Extra environment variables
  # SMTP for notification / invite emails (Microsoft 365 / Outlook: smtp.office365.com:587 + STARTTLS).
  # MAIL FROM is sent as MAIL FROM:<SMTP_FROM>, so SMTP_FROM must be a bare email address (addr@domain).
  # Set SMTP_PASS via CI (--set-string) or a secret manager; do not commit real mailbox passwords.
  extraEnv:
    SMTP_HOST: smtp.office365.com
    SMTP_PORT: "587"
    SMTP_SECURE: "false"
    SMTP_HELO_HOST: "localhost"
    # Same licensed mailbox as SMTP_USER unless your tenant allows a separate send-as address.
    SMTP_FROM: "support@ai-harness.com"
    SMTP_USER: "support@ai-harness.com"
    SMTP_PASS: ""
    AI_HARNESS_AUTH_MICROSOFT_CLIENT_ID: "sample"
    AI_HARNESS_AUTH_MICROSOFT_CLIENT_SECRET: "sample"
    AI_HARNESS_AUTH_MICROSOFT_TENANT_ID: "sample"


# -- Shared Azure File Storage (one file share for ALL tenants, subPath per tenant)
# Pre-requisite: Storage Account + File Share must be created once by infra team.
# Secret "azure-storage-secret" must exist in kube-system with storage account credentials.
#
# mountOptions: SMB mapping for the pod user (1000:1000). Without uid/gid/mode, Azure Files
# often surfaces EPERM to tools that use sendfile/copy_file_range or strict permission checks
# (e.g. OpenAI Codex session files under .../codex-home/sessions). If you change these options,
# you must recreate the PersistentVolume (mountOptions are immutable on existing PVs); data on
# the share is unchanged.
sharedStorage:
  resourceGroup: "ai-harness-prod"
  storageAccount: "aiharnessstorage"
  fileShareName: "paperclip-shared"
  secretName: "azure-storage-secret"
  secretNamespace: "kube-system"
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - uid=1000
    - gid=1000
    - mfsymlinks

# -- Ingress configuration
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cert-issuer
  hosts:
    - host: dev-test.app.ai-harness.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-ai-harness-tls
      hosts:
        - dev-test.app.ai-harness.com
