apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperclip.fullname" . }}-server
  labels:
    {{- include "paperclip.server.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "paperclip.databaseUrl" . | quote }}
  better-auth-secret: {{ .Values.server.secrets.betterAuthSecret | quote }}
  {{- if and .Values.server.secrets.paperclipSecretsMasterKey (ne .Values.server.secrets.paperclipSecretsMasterKey "") }}
  paperclip-secrets-master-key: {{ .Values.server.secrets.paperclipSecretsMasterKey | quote }}
  {{- end }}
  {{- if .Values.server.paperclip.openaiApiKey }}
  openai-api-key: {{ .Values.server.paperclip.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.server.paperclip.anthropicApiKey }}
  anthropic-api-key: {{ .Values.server.paperclip.anthropicApiKey | quote }}
  {{- end }}
  {{- if and .Values.server.secrets.stripeSecretKey (ne .Values.server.secrets.stripeSecretKey "") }}
  stripe-secret-key: {{ .Values.server.secrets.stripeSecretKey | quote }}
  {{- end }}
  {{- if and .Values.server.secrets.stripeWebhookSecret (ne .Values.server.secrets.stripeWebhookSecret "") }}
  stripe-webhook-secret: {{ .Values.server.secrets.stripeWebhookSecret | quote }}
  {{- end }}
