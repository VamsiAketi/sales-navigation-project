# Cluster-scoped PersistentVolume — one per tenant, all pointing to the SAME Azure File Share.
# subPath mounting in the pod isolates each tenant's data into its own subdirectory:
#   paperclip-shared/<instanceId>/   (e.g. paperclip-shared/acme/, paperclip-shared/dev/)

apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "paperclip.fullname" . }}-shared-pv
  labels:
    {{- include "paperclip.server.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.server.persistence.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: azurefile-csi
  csi:
    driver: file.csi.azure.com
    readOnly: false
    # volumeHandle must be unique per PV — using release name ensures uniqueness across tenants
    volumeHandle: {{ include "paperclip.fullname" . }}-shared-pv
    volumeAttributes:
      resourceGroup: {{ .Values.sharedStorage.resourceGroup }}
      storageAccount: {{ .Values.sharedStorage.storageAccount }}
      shareName: {{ .Values.sharedStorage.fileShareName }}
    nodeStageSecretRef:
      name: {{ .Values.sharedStorage.secretName }}
      namespace: {{ .Values.sharedStorage.secretNamespace }}
