apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperclip.fullname" . }}-server
  labels:
    {{- include "paperclip.server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "paperclip.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "paperclip.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- if .Values.server.nodeName }}
      nodeName: {{ .Values.server.nodeName | quote }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

      {{- with .Values.server.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-server
                  key: database-url
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for Postgres using DATABASE_URL..."
              ATTEMPTS=0
              until psql "$DATABASE_URL" -c 'SELECT 1' >/dev/null 2>&1; do
                ATTEMPTS=$((ATTEMPTS + 1))
                echo "Postgres not ready yet, sleeping... (attempt ${ATTEMPTS})"
                sleep 3
              done
              echo "Postgres is ready."
      {{- end }}

      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              printenv OPENAI_API_KEY | codex login --with-api-key
              if [ ! -f "${PAPERCLIP_CONFIG}" ]; then
                echo '=== WAITING FOR 30 SECONDS ===';
                sleep 30;
                echo '=== WAITING FOR 30 SECONDS DONE ===';
                echo '=== ONBOARDING PAPERCLIP INSTANCE ===';
                pnpm paperclipai onboard --yes;
                echo '=== STARTING SERVER FOR BOOTSTRAP ===';
                pnpm --filter @paperclipai/server dev &
                echo 'Waiting for server (max 60s)...';
                ATTEMPTS=0;
                until curl -sf http://localhost:3100/api/health > /dev/null 2>&1; do
                  ATTEMPTS=$((ATTEMPTS + 1));
                  if [ "$ATTEMPTS" -ge 30 ]; then
                    echo 'Server did not become healthy within 60s, aborting bootstrap.';
                    exit 1;
                  fi;
                  echo "Waiting for server... (${ATTEMPTS}/30)";
                  sleep 2;
                done;
                echo '=== BOOTSTRAPPING ADMIN (CEO) ===';
                pnpm paperclipai auth bootstrap-ceo --data-dir /paperclip --base-url "{{ .Values.server.paperclip.publicUrl }}";
                echo '=== BOOTSTRAP DONE ===';
                wait;
              else
                echo "Config ${PAPERCLIP_CONFIG} exists; skipping onboarding/bootstrap.";
                pnpm --filter @paperclipai/server dev;
              fi
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3100"
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /paperclip
            - name: PAPERCLIP_HOME
              value: /paperclip
            - name: PAPERCLIP_INSTANCE_ID
              value: {{ .Values.server.paperclip.instanceId | quote }}
            - name: PAPERCLIP_ONBOARD_AUTO_RUN
              value: "false"
            - name: PAPERCLIP_CONFIG
              value: /paperclip/instances/default/config.json
            - name: SERVE_UI
              value: {{ .Values.server.serveUi | quote }}
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: {{ .Values.server.paperclip.deploymentMode | quote }}
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: {{ .Values.server.paperclip.deploymentExposure | quote }}
            - name: PAPERCLIP_PUBLIC_URL
              value: {{ .Values.server.paperclip.publicUrl | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-server
                  key: database-url
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-server
                  key: better-auth-secret
            {{- if .Values.server.paperclip.openaiApiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-server
                  key: openai-api-key
            {{- end }}
            {{- if .Values.server.paperclip.anthropicApiKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-server
                  key: anthropic-api-key
            {{- end }}
            {{- range $key, $value := .Values.server.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: paperclip-data
              mountPath: /paperclip
              subPath: {{ .Values.server.paperclip.instanceId }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: paperclip-data
          persistentVolumeClaim:
            claimName: {{ include "paperclip.fullname" . }}-paperclip-data
