apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "paperclip.fullname" . }}-paperclip-data
  labels:
    {{- include "paperclip.server.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.server.persistence.size }}
  storageClassName: azurefile-csi
  # Bind to the per-tenant PV that points to the shared Azure File Share
  volumeName: {{ include "paperclip.fullname" . }}-shared-pv
