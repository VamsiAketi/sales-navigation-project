name: Build and Deploy Dev

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: ai-harness
  DEV_RELEASE_NAME: ai-harness-dev
  DEV_NAMESPACE: dev
  # Must match server.paperclip.publicUrl / ingress host for dev (CEO bootstrap + auth callbacks).
  DEV_PUBLIC_URL: https://dev-test.app.ai-harness.com
  DEFAULT_CEO_NAME: Navneet Agarwal
  DEFAULT_CEO_EMAIL: navneet@ai-harness.com

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    # Create GitHub Environment "dev" (Settings → Environments) and add secrets there
    # (e.g. OPENAI_API_KEY, ANTHROPIC_API_KEY) to scope LLM keys to dev; repo secrets
    # remain available for Azure, ACR, Postgres, etc.
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract ACR name from login server
        id: acr
        run: |
          # e.g. myregistry.azurecr.io -> myregistry
          LOGIN_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${LOGIN_SERVER%%.*}"
          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image tag YYYY.MM.DD.N
        id: tag
        run: |
          DATE_TAG=$(date +'%Y.%m.%d')
          # Count existing tags for this date in ACR and increment
          EXISTING_COUNT=$(az acr repository show-tags \
            -n "${{ steps.acr.outputs.acr_name }}" \
            --repository "${IMAGE_NAME}" \
            --query "[?starts_with(@, '${DATE_TAG}.')]|length(@)" -o tsv 2>/dev/null || echo 0)
          NEXT=$((EXISTING_COUNT + 1))
          IMAGE_TAG="${DATE_TAG}.${NEXT}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed image tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: |
            type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:dev-latest

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Ensure dev namespace
        run: |
          kubectl get ns "${DEV_NAMESPACE}" >/dev/null 2>&1 || kubectl create ns "${DEV_NAMESPACE}"

      - name: Create dev database on shared Azure PostgreSQL
        run: |
          DB_NAME="ai-harness-dev"

          echo "Creating database '${DB_NAME}' on shared Azure PostgreSQL instance..."
          az postgres flexible-server db create \
            --resource-group "${{ secrets.AZURE_POSTGRES_RG }}" \
            --server-name   "${{ secrets.AZURE_POSTGRES_SERVER }}" \
            --database-name "${DB_NAME}" \
            2>&1 | grep -v "already exists" || true

          echo "Database '${DB_NAME}' is ready."

      - name: Deploy dev with Helm
        run: |
          IMAGE_TAG="${{ steps.tag.outputs.image_tag }}"
          DB_NAME="ai-harness-dev"
          DATABASE_URL="postgresql://${{ secrets.AZURE_POSTGRES_USER }}:${{ secrets.AZURE_POSTGRES_PASSWORD }}@${{ secrets.AZURE_POSTGRES_HOST }}:5432/${DB_NAME}?sslmode=require"

          # Helm 4+ uses server-side apply; scaling the Deployment in Rancher/UI makes Rancher own
          # .spec.replicas and breaks upgrade until we force-conflict or reset replicas elsewhere.
          FORCE_CONFLICTS_ARG=""
          if helm upgrade --help 2>&1 | grep -q -- '--force-conflicts'; then
            FORCE_CONFLICTS_ARG="--force-conflicts"
            echo "Helm 4+: using --force-conflicts so the chart can reclaim .spec.replicas after UI scale."
          fi

          helm upgrade --install "${DEV_RELEASE_NAME}" ./helm \
          --namespace "${DEV_NAMESPACE}" \
          --set fullnameOverride="${DEV_RELEASE_NAME}" \
          --set postgres.enabled=false \
          --set server.image.repository="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}" \
          --set server.image.tag="${IMAGE_TAG}" \
          --set server.image.pullPolicy=IfNotPresent \
          --set server.extraEnv.IMAGE_TAG="${IMAGE_TAG}" \
          --set server.paperclip.instanceId="dev" \
          --set-string server.paperclip.publicUrl="${{ env.DEV_PUBLIC_URL }}" \
          --set-string server.extraEnv.SMTP_HOST="smtp.office365.com" \
          --set-string server.extraEnv.SMTP_PORT="587" \
          --set-string server.extraEnv.SMTP_SECURE="false" \
          --set-string server.extraEnv.SMTP_USER="support@ai-harness.com" \
          --set-string server.extraEnv.SMTP_PASS="${{ secrets.SMTP_PASSWORD }}" \
          --set-string server.extraEnv.SMTP_FROM="support@ai-harness.com" \
          --set-string server.database.externalUrl="${DATABASE_URL}" \
          --set-string server.secrets.betterAuthSecret="${{ secrets.BETTER_AUTH_SECRET }}" \
          --set-string server.secrets.paperclipSecretsMasterKey="${{ secrets.PAPERCLIP_SECRETS_MASTER_KEY }}" \
          --set-string server.paperclip.openaiApiKey="${{ secrets.OPENAI_API_KEY }}" \
          --set-string server.extraEnv.AI_HARNESS_AUTH_MICROSOFT_CLIENT_ID="${{ secrets.MICROSOFT_CLIENT_ID }}" \
          --set-string server.extraEnv.AI_HARNESS_AUTH_MICROSOFT_CLIENT_SECRET="${{ secrets.MICROSOFT_CLIENT_SECRET }}" \
          --set-string server.extraEnv.AI_HARNESS_AUTH_MICROSOFT_TENANT_ID="${{ secrets.MICROSOFT_TENANT_ID }}" \
          ${FORCE_CONFLICTS_ARG}
      - name: Capture CEO invite URL from logs
        id: capture_invite
        run: |
          echo "Attempting to capture CEO invite URL from server logs..."
          # Wait for rollout (handles slow image pulls / startup)
          kubectl rollout status deployment/${DEV_RELEASE_NAME}-server -n "${DEV_NAMESPACE}" --timeout=300s || echo "Warning: rollout did not complete within timeout; continuing to check logs."

          INVITE_LINE=""
          # Retry a few times in case bootstrap runs slightly after readiness
          for i in $(seq 1 5); do
            echo "Attempt ${i} to find invite URL in logs..."
            INVITE_LINE=$(kubectl logs deployment/${DEV_RELEASE_NAME}-server -n "${DEV_NAMESPACE}" --tail=500 | grep -m1 'Invite URL:' || true)
            if [ -n "$INVITE_LINE" ]; then
              break
            fi
            sleep 15
          done

          if [ -z "$INVITE_LINE" ]; then
            echo "No invite URL found in recent logs. This likely means the CEO was already bootstrapped previously."
            echo "invite_url=" >> "$GITHUB_OUTPUT"
            {
              echo "## Paperclip Dev CEO Invite"
              echo ""
              echo "- No new invite URL found in recent logs."
              echo "- This usually means the CEO was already bootstrapped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          INVITE_URL=$(echo "$INVITE_LINE" | awk '{print $NF}')
          echo "Found invite URL: $INVITE_URL"
          echo "invite_url=${INVITE_URL}" >> "$GITHUB_OUTPUT"

          {
            echo "## Paperclip Dev CEO Invite"
            echo ""
            echo "A new CEO invite URL was created during this deployment:"
            echo ""
            echo "  ${INVITE_URL}"
            echo ""
            echo "_Note: This URL is typically single-use and time-limited. Share it only with the intended recipient._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-bootstrap CEO user and accept invite
        id: bootstrap_ceo
        if: steps.capture_invite.outputs.invite_url != ''
        run: |
          set -euo pipefail

          BASE_URL="${{ env.DEV_PUBLIC_URL }}"
          USER_NAME="${{ env.DEFAULT_CEO_NAME }}"
          USER_EMAIL="${{ env.DEFAULT_CEO_EMAIL }}"
          # Generate a random 24-char base64 password
          USER_PASSWORD="$(openssl rand -base64 18)"

          INVITE_URL="${{ steps.capture_invite.outputs.invite_url }}"
          INVITE_TOKEN="${INVITE_URL##*/}"

          echo "Using invite URL: ${INVITE_URL}"
          echo "Bootstrapping CEO user ${USER_EMAIL} at ${BASE_URL}"

          TMP_DIR="$(mktemp -d)"
          COOKIE_JAR="$TMP_DIR/cookies.txt"

          # Ingress/LB can briefly return 502/503/504 right after rollout.
          # Wait for the public endpoint to be consistently reachable first.
          echo "Waiting for public health endpoint at ${BASE_URL}/api/health ..."
          HEALTH_OK=0
          for i in $(seq 1 24); do
            HEALTH_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/api/health" || true)"
            if [ "$HEALTH_STATUS" = "200" ]; then
              HEALTH_OK=1
              echo "Health endpoint is ready."
              break
            fi
            echo "Health check attempt ${i}/24 returned ${HEALTH_STATUS:-curl_error}; retrying in 5s..."
            sleep 5
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "Public health endpoint did not become ready in time." >&2
            exit 1
          fi

          post_json_with_cookies() {
            local url="$1"
            local body="$2"
            local output_file="$3"
            curl -sS \
              -o "$output_file" \
              -w "%{http_code}" \
              -c "$COOKIE_JAR" \
              -b "$COOKIE_JAR" \
              -H "Content-Type: application/json" \
              -H "Origin: $BASE_URL" \
              -X POST \
              "$url" \
              --data "$body"
          }

          post_json_with_cookies_retry() {
            local url="$1"
            local body="$2"
            local output_file="$3"
            local label="$4"
            local attempts="${5:-5}"
            local sleep_seconds="${6:-8}"
            local status=""

            for i in $(seq 1 "$attempts"); do
              status="$(post_json_with_cookies "$url" "$body" "$output_file")"
              if [[ "$status" =~ ^2 ]]; then
                echo "$status"
                return 0
              fi

              if [[ "$status" = "502" || "$status" = "503" || "$status" = "504" ]]; then
                echo "${label}: transient HTTP ${status} on attempt ${i}/${attempts}; retrying in ${sleep_seconds}s..."
                sleep "$sleep_seconds"
                continue
              fi

              echo "$status"
              return 0
            done

            # Return final status after retries (likely still 5xx).
            echo "$status"
            return 0
          }

          # 1) Sign up or sign in the CEO user
          SIGNUP_RESP="$TMP_DIR/signup.json"
          SIGNUP_STATUS="$(post_json_with_cookies_retry \
            "$BASE_URL/api/auth/sign-up/email" \
            "{\"name\":\"$USER_NAME\",\"email\":\"$USER_EMAIL\",\"password\":\"$USER_PASSWORD\"}" \
            "$SIGNUP_RESP" \
            "sign-up")"

          if [[ "$SIGNUP_STATUS" =~ ^2 ]]; then
            echo "Created CEO user ${USER_EMAIL}"
          else
            SIGNIN_RESP="$TMP_DIR/signin.json"
            SIGNIN_STATUS="$(post_json_with_cookies_retry \
              "$BASE_URL/api/auth/sign-in/email" \
              "{\"email\":\"$USER_EMAIL\",\"password\":\"$USER_PASSWORD\"}" \
              "$SIGNIN_RESP" \
              "sign-in")"

            if [[ "$SIGNIN_STATUS" =~ ^2 ]]; then
              echo "Signed in existing CEO user ${USER_EMAIL}"
            else
              echo "Failed to sign up or sign in CEO user" >&2
              echo "Sign-up response:" >&2
              cat "$SIGNUP_RESP" || true
              echo >&2
              echo "Sign-in response:" >&2
              cat "$SIGNIN_RESP" || true
              exit 1
            fi
          fi

          echo "Authenticated as ${USER_EMAIL}, accepting invite..."

          # 2) Accept the invite as this user
          ACCEPT_RESP="$TMP_DIR/accept.json"
          ACCEPT_STATUS="$(post_json_with_cookies_retry \
            "$BASE_URL/api/invites/$INVITE_TOKEN/accept" \
            '{"requestType":"human"}' \
            "$ACCEPT_RESP" \
            "accept-invite")"

          if ! [[ "$ACCEPT_STATUS" =~ ^2 ]]; then
            echo "Failed to accept invite (HTTP $ACCEPT_STATUS)" >&2
            cat "$ACCEPT_RESP" || true
            exit 1
          fi

          echo "CEO invite accepted automatically for ${USER_EMAIL}"
          echo "CEO login details:"
          echo "  Email: ${USER_EMAIL}"
          echo "  Password: ${USER_PASSWORD}"

          echo "user_password=${USER_PASSWORD}" >> "$GITHUB_OUTPUT"

      - name: Send CEO credentials email
        if: steps.capture_invite.outputs.invite_url != '' && steps.bootstrap_ceo.outcome == 'success'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: false
          username: "support@ai-harness.com"
          password: ${{ secrets.SMTP_PASSWORD }}
          from: "AI-Harness Support <support@ai-harness.com>"
          to: navneet@ai-harness.com
          subject: "Your AI-Harness dev access is ready"
          body: |
            Hi Navneet Agarwal,

            Your AI-Harness dev environment is ready.

            You can sign in at:
            https://dev-test.app.ai-harness.com

            Your initial login credentials are:
            - Email: navneet@ai-harness.com
            - Password: ${{ steps.bootstrap_ceo.outputs.user_password }}

            For security, please sign in and change your password as soon as possible.

            Thanks,
            AI-Harness Support

