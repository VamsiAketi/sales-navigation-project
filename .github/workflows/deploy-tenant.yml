name: Deploy Tenant

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name (used in namespace and host)"
        required: true
        type: string
      nodeName:
        description: "Kubernetes node name to schedule this tenant on (optional)"
        required: false
        type: string
      userName:
        description: "Default CEO user full name"
        required: false
        type: string
      userEmail:
        description: "Default CEO user email"
        required: false
        type: string
      imageTag:
        description: "Image tag to deploy (YYYY.MM.DD.N)"
        required: true
        type: string
      createNamespace:
        description: "Create namespace if it does not exist"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  IMAGE_NAME: ai-harness

jobs:
  deploy-tenant:
    runs-on: ubuntu-latest
    # Resolves secrets from a GitHub Environment whose name matches the tenant input
    # (e.g. tenant "acme" → Environment "acme"). Add per-tenant OPENAI_API_KEY,
    # ANTHROPIC_API_KEY, and any overrides there; repo-level secrets (Azure, ACR, etc.)
    # remain available to the job.
    environment: ${{ github.event.inputs.tenant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract ACR name from login server
        id: acr
        run: |
          LOGIN_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${LOGIN_SERVER%%.*}"
          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve image tag and validate
        id: tag
        run: |
          IMAGE_TAG="${{ github.event.inputs.imageTag }}"
          ACR_NAME="${{ steps.acr.outputs.acr_name }}"

          echo "Using provided image tag: ${IMAGE_TAG}"

          EXISTS=$(az acr repository show-tags \
            -n "${ACR_NAME}" \
            --repository "${IMAGE_NAME}" \
            --query "[?@=='${IMAGE_TAG}']|length(@)" -o tsv 2>/dev/null || echo 0)

          if [ "${EXISTS}" -eq 0 ]; then
            echo "ERROR: Tag '${IMAGE_TAG}' does not exist in ACR for repository '${IMAGE_NAME}'."
            exit 1
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Recreate PV if tenant was previously deleted
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          PV_NAME="ai-harness-${TENANT}-shared-pv"

          PV_STATUS=$(kubectl get pv "${PV_NAME}" -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
          echo "PV '${PV_NAME}' status: ${PV_STATUS}"

          if [ "${PV_STATUS}" = "Released" ]; then
            # PVC was deleted with the namespace but PV survived (Retain policy).
            # Deleting it lets Helm recreate it fresh — no stale claimRef UID blocking binding.
            echo "PV is Released — deleting so Helm recreates it cleanly..."
            kubectl delete pv "${PV_NAME}"
            echo "Done. Helm will create a fresh PV on install."
          elif [ "${PV_STATUS}" = "Bound" ]; then
            echo "PV is Bound (tenant is live). No action needed."
          elif [ "${PV_STATUS}" = "Available" ]; then
            echo "PV is Available. No action needed."
          elif [ "${PV_STATUS}" = "NotFound" ]; then
            echo "PV does not exist. Helm will create it."
          else
            echo "PV status is '${PV_STATUS}'. No action taken."
          fi

      - name: Create tenant database on shared Azure PostgreSQL
        id: create_db
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          DB_NAME="ai-harness-${TENANT}"

          # Check if DB already exists before creating so we know if it's fresh
          DB_EXISTS=$(az postgres flexible-server db show \
            --resource-group "${{ secrets.AZURE_POSTGRES_RG }}" \
            --server-name   "${{ secrets.AZURE_POSTGRES_SERVER }}" \
            --database-name "${DB_NAME}" \
            --query "name" -o tsv 2>/dev/null || echo "")

          if [ -z "${DB_EXISTS}" ]; then
            echo "Database '${DB_NAME}' does not exist. Creating fresh..."
            echo "db_is_fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "Database '${DB_NAME}' already exists."
            echo "db_is_fresh=false" >> "$GITHUB_OUTPUT"
          fi

          az postgres flexible-server db create \
            --resource-group "${{ secrets.AZURE_POSTGRES_RG }}" \
            --server-name   "${{ secrets.AZURE_POSTGRES_SERVER }}" \
            --database-name "${DB_NAME}" \
            2>&1 | grep -v "already exists" || true

          echo "Database '${DB_NAME}' is ready."

      - name: Clear stale config if DB is fresh
        if: steps.create_db.outputs.db_is_fresh == 'true'
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          CONFIG_PATH="${TENANT}/instances/default/config.json"

          echo "DB is fresh — checking for stale config.json on file share..."

          STORAGE_KEY=$(az storage account keys list \
            --resource-group "ai-harness-prod" \
            --account-name   "aiharnessstorage" \
            --query "[0].value" -o tsv)

          FILE_EXISTS=$(az storage file exists \
            --account-name "aiharnessstorage" \
            --share-name   "paperclip-shared" \
            --path         "${CONFIG_PATH}" \
            --account-key  "${STORAGE_KEY}" \
            --query        "exists" -o tsv)

          if [ "${FILE_EXISTS}" = "true" ]; then
            echo "Stale config.json found. Deleting so app onboards fresh against new DB..."
            az storage file delete \
              --account-name "aiharnessstorage" \
              --share-name   "paperclip-shared" \
              --path         "${CONFIG_PATH}" \
              --account-key  "${STORAGE_KEY}"
            echo "config.json deleted. App will onboard fresh and generate a new invite URL."
          else
            echo "No stale config.json found. Nothing to clear."
          fi

      - name: Deploy tenant with Helm
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          IMAGE_TAG="${{ steps.tag.outputs.image_tag }}"
          CREATE_NS="${{ github.event.inputs.createNamespace }}"
          NODE_NAME="${{ github.event.inputs.nodeName }}"

          NAMESPACE="ai-harness-${TENANT}"
          RELEASE_NAME="ai-harness-${TENANT}"
          HOST="${TENANT}.app.ai-harness.com"
          DB_NAME="ai-harness-${TENANT}"

          # Build connection string for the tenant's database on the shared instance
          # Azure PostgreSQL Flexible Server requires sslmode=require
          DATABASE_URL="postgresql://${{ secrets.AZURE_POSTGRES_USER }}:${{ secrets.AZURE_POSTGRES_PASSWORD }}@${{ secrets.AZURE_POSTGRES_HOST }}:5432/${DB_NAME}?sslmode=require"

          if [ "${CREATE_NS}" = "true" ]; then
            kubectl get ns "${NAMESPACE}" >/dev/null 2>&1 || kubectl create ns "${NAMESPACE}"
          fi

          HELM_EXTRA_ARGS=""
          if [ -n "${NODE_NAME}" ]; then
            echo "Scheduling tenant '${TENANT}' on node '${NODE_NAME}'"
            HELM_EXTRA_ARGS="${HELM_EXTRA_ARGS} --set server.nodeName=${NODE_NAME}"
          fi

          FORCE_CONFLICTS_ARG=""
          if helm upgrade --help 2>&1 | grep -q -- '--force-conflicts'; then
            FORCE_CONFLICTS_ARG="--force-conflicts"
            echo "Helm 4+: using --force-conflicts so the chart can reclaim .spec.replicas after UI scale."
          fi

          helm upgrade --install "${RELEASE_NAME}" ./helm \
            --namespace "${NAMESPACE}" \
            --set fullnameOverride="${RELEASE_NAME}" \
            --set postgres.enabled=false \
            --set server.image.repository="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}" \
            --set server.image.tag="${IMAGE_TAG}" \
            --set server.image.pullPolicy=IfNotPresent \
            --set server.extraEnv.IMAGE_TAG="${IMAGE_TAG}" \
            --set server.paperclip.instanceId="${TENANT}" \
            --set server.paperclip.publicUrl="https://${HOST}" \
            --set-string server.extraEnv.MS_TENANT_ID="${{ secrets.MS_TENANT_ID }}" \
            --set-string server.extraEnv.MS_CLIENT_ID="${{ secrets.MS_CLIENT_ID }}" \
            --set-string server.extraEnv.MS_CLIENT_SECRET="${{ secrets.MS_CLIENT_SECRET }}" \
            --set-string server.extraEnv.MS_SENDER_EMAIL="${{ secrets.MS_SENDER_EMAIL }}" \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host="${HOST}" \
            --set ingress.hosts[0].paths[0].path="/" \
            --set ingress.hosts[0].paths[0].pathType="Prefix" \
            --set ingress.tls[0].hosts[0]="${HOST}" \
            --set ingress.tls[0].secretName="app-ai-harness-tls" \
            --set-string server.database.externalUrl="${DATABASE_URL}" \
            --set-string server.secrets.betterAuthSecret="${{ secrets.BETTER_AUTH_SECRET }}" \
            --set-string server.secrets.paperclipSecretsMasterKey="${{ secrets.PAPERCLIP_SECRETS_MASTER_KEY }}" \
            --set-string server.paperclip.openaiApiKey="${{ secrets.OPENAI_API_KEY }}" \
            ${HELM_EXTRA_ARGS} ${FORCE_CONFLICTS_ARG}

      - name: Capture CEO invite URL from logs
        id: capture_invite
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          NAMESPACE="ai-harness-${TENANT}"
          RELEASE_NAME="ai-harness-${TENANT}"

          echo "Attempting to capture CEO invite URL from server logs for tenant '${TENANT}'..."
          # Wait for rollout (handles slow image pulls / startup)
          kubectl rollout status deployment/${RELEASE_NAME}-server -n "${NAMESPACE}" --timeout=300s || echo "Warning: rollout did not complete within timeout; continuing to check logs."

          INVITE_LINE=""
          # Retry a few times in case bootstrap runs slightly after readiness
          for i in $(seq 1 15); do
            echo "Attempt ${i} to find invite URL in logs..."
            INVITE_LINE=$(kubectl logs deployment/${RELEASE_NAME}-server -n "${NAMESPACE}" --tail=500 | grep -m1 'Invite URL:' || true)
            if [ -n "$INVITE_LINE" ]; then
              break
            fi
            sleep 15
          done

          if [ -z "$INVITE_LINE" ]; then
            echo "No invite URL found in recent logs. This likely means the CEO was already bootstrapped previously."
            echo "invite_url=" >> "$GITHUB_OUTPUT"
            {
              echo "## Paperclip Tenant CEO Invite"
              echo ""
              echo "- No new invite URL found in recent logs for tenant '${TENANT}'."
              echo "- This usually means the CEO was already bootstrapped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          INVITE_URL=$(echo "$INVITE_LINE" | awk '{print $NF}')
          echo "Found invite URL: $INVITE_URL"
          echo "invite_url=${INVITE_URL}" >> "$GITHUB_OUTPUT"

          {
            echo "## Paperclip Tenant CEO Invite"
            echo ""
            echo "A new CEO invite URL was created during this deployment for tenant '${TENANT}':"
            echo ""
            echo "  ${INVITE_URL}"
            echo ""
            echo "_Note: This URL is typically single-use and time-limited. Share it only with the intended recipient._"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Auto-bootstrap CEO user and accept invite
        id: bootstrap_ceo
        if: steps.capture_invite.outputs.invite_url != '' && github.event.inputs.userEmail != '' && github.event.inputs.userName != ''
        run: |
          set -euo pipefail

          TENANT="${{ github.event.inputs.tenant }}"
          NAMESPACE="ai-harness-${TENANT}"
          RELEASE_NAME="ai-harness-${TENANT}"
          HOST="${TENANT}.app.ai-harness.com"
          BASE_URL="https://${HOST}"

          USER_NAME="${{ github.event.inputs.userName }}"
          USER_EMAIL="${{ github.event.inputs.userEmail }}"
          # Generate a random 24-char base64 password
          USER_PASSWORD="$(openssl rand -base64 18)"

          INITIAL_INVITE_URL="${{ steps.capture_invite.outputs.invite_url }}"

          echo "Initial invite URL from capture step: ${INITIAL_INVITE_URL}"
          echo "Bootstrapping CEO user ${USER_EMAIL} at ${BASE_URL}"

          TMP_DIR="$(mktemp -d)"
          COOKIE_JAR="$TMP_DIR/cookies.txt"

          # Ingress/LB can briefly return 502/503/504 right after rollout.
          # Wait for the public endpoint to be consistently reachable first.
          echo "Waiting for public health endpoint at ${BASE_URL}/api/health ..."
          HEALTH_OK=0
          for i in $(seq 1 24); do
            HEALTH_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/api/health" || true)"
            if [ "$HEALTH_STATUS" = "200" ]; then
              HEALTH_OK=1
              echo "Health endpoint is ready."
              break
            fi
            echo "Health check attempt ${i}/24 returned ${HEALTH_STATUS:-curl_error}; retrying in 5s..."
            sleep 5
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "Public health endpoint did not become ready in time." >&2
            exit 1
          fi

          post_json_with_cookies() {
            local url="$1"
            local body="$2"
            local output_file="$3"
            curl -sS \
              -o "$output_file" \
              -w "%{http_code}" \
              -c "$COOKIE_JAR" \
              -b "$COOKIE_JAR" \
              -H "Content-Type: application/json" \
              -H "Origin: $BASE_URL" \
              -X POST \
              "$url" \
              --data "$body"
          }

          post_json_with_cookies_retry() {
            local url="$1"
            local body="$2"
            local output_file="$3"
            local label="$4"
            local attempts="${5:-5}"
            local sleep_seconds="${6:-8}"
            local status=""

            for i in $(seq 1 "$attempts"); do
              status="$(post_json_with_cookies "$url" "$body" "$output_file")"
              if [[ "$status" =~ ^2 ]]; then
                echo "$status"
                return 0
              fi

              if [[ "$status" = "502" || "$status" = "503" || "$status" = "504" ]]; then
                echo "${label}: transient HTTP ${status} on attempt ${i}/${attempts}; retrying in ${sleep_seconds}s..."
                sleep "$sleep_seconds"
                continue
              fi

              echo "$status"
              return 0
            done

            # Return final status after retries (likely still 5xx).
            echo "$status"
            return 0
          }

          refresh_invite_token_from_logs() {
            local line=""
            local url=""
            local token=""
            line="$(kubectl logs deployment/${RELEASE_NAME}-server -n "${NAMESPACE}" --tail=1000 | grep 'Invite URL:' | tail -n1 || true)"
            if [ -z "$line" ]; then
              echo ""
              return 0
            fi
            url="$(echo "$line" | awk '{print $NF}')"
            token="${url##*/}"
            echo "$token"
          }

          # 1) Sign up or sign in the CEO user
          SIGNUP_RESP="$TMP_DIR/signup.json"
          SIGNUP_STATUS="$(post_json_with_cookies_retry \
            "$BASE_URL/api/auth/sign-up/email" \
            "{\"name\":\"$USER_NAME\",\"email\":\"$USER_EMAIL\",\"password\":\"$USER_PASSWORD\"}" \
            "$SIGNUP_RESP" \
            "sign-up")"

          if [[ "$SIGNUP_STATUS" =~ ^2 ]]; then
            echo "Created CEO user ${USER_EMAIL}"
          else
            SIGNIN_RESP="$TMP_DIR/signin.json"
            SIGNIN_STATUS="$(post_json_with_cookies_retry \
              "$BASE_URL/api/auth/sign-in/email" \
              "{\"email\":\"$USER_EMAIL\",\"password\":\"$USER_PASSWORD\"}" \
              "$SIGNIN_RESP" \
              "sign-in")"

            if [[ "$SIGNIN_STATUS" =~ ^2 ]]; then
              echo "Signed in existing CEO user ${USER_EMAIL}"
            else
              echo "Failed to sign up or sign in CEO user" >&2
              echo "Sign-up response:" >&2
              cat "$SIGNUP_RESP" || true
              echo >&2
              echo "Sign-in response:" >&2
              cat "$SIGNIN_RESP" || true
              exit 1
            fi
          fi

          echo "Authenticated as ${USER_EMAIL}, accepting invite..."

          INVITE_TOKEN="$(refresh_invite_token_from_logs)"
          if [ -z "$INVITE_TOKEN" ]; then
            INVITE_TOKEN="${INITIAL_INVITE_URL##*/}"
            echo "No fresher invite token found in logs; using captured token."
          else
            echo "Using freshest invite token from logs."
          fi

          # 2) Accept the invite as this user
          ACCEPT_RESP="$TMP_DIR/accept.json"
          ACCEPT_STATUS="$(post_json_with_cookies_retry \
            "$BASE_URL/api/invites/$INVITE_TOKEN/accept" \
            '{"requestType":"human"}' \
            "$ACCEPT_RESP" \
            "accept-invite")"

          if [ "$ACCEPT_STATUS" = "404" ]; then
            echo "Invite token returned 404; refreshing token from latest logs and retrying once..."
            RETRY_TOKEN="$(refresh_invite_token_from_logs)"
            if [ -n "$RETRY_TOKEN" ] && [ "$RETRY_TOKEN" != "$INVITE_TOKEN" ]; then
              INVITE_TOKEN="$RETRY_TOKEN"
              ACCEPT_STATUS="$(post_json_with_cookies_retry \
                "$BASE_URL/api/invites/$INVITE_TOKEN/accept" \
                '{"requestType":"human"}' \
                "$ACCEPT_RESP" \
                "accept-invite-retry")"
            fi
          fi

          if ! [[ "$ACCEPT_STATUS" =~ ^2 ]]; then
            echo "Failed to accept invite (HTTP $ACCEPT_STATUS)" >&2
            cat "$ACCEPT_RESP" || true
            exit 1
          fi

          echo "CEO invite accepted automatically for ${USER_EMAIL}"
          echo "CEO login details:"
          echo "  Email: ${USER_EMAIL}"
          echo "  Password: ${USER_PASSWORD}"

          echo "user_password=${USER_PASSWORD}" >> "$GITHUB_OUTPUT"

      - name: Send CEO credentials email
        if: steps.capture_invite.outputs.invite_url != '' && github.event.inputs.userEmail != '' && github.event.inputs.userName != ''
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER_EMAIL: ${{ secrets.MS_SENDER_EMAIL }}
          CEO_NAME: ${{ github.event.inputs.userName }}
          CEO_EMAIL: ${{ github.event.inputs.userEmail }}
          USER_PASSWORD: ${{ steps.bootstrap_ceo.outputs.user_password }}
          TENANT: ${{ github.event.inputs.tenant }}
        run: |
          python3 <<'PY'
          import json
          import os
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request

          ctx = ssl.create_default_context()

          def http_json(req: urllib.request.Request):
              with urllib.request.urlopen(req, context=ctx) as r:
                  raw = r.read().decode("utf-8", errors="replace")
                  return r.status, (json.loads(raw) if raw.strip() else {})

          tenant_id = os.environ["MS_TENANT_ID"]
          cid = os.environ["MS_CLIENT_ID"]
          sec = os.environ["MS_CLIENT_SECRET"]
          sender = os.environ["MS_SENDER_EMAIL"]
          ceo_name = os.environ["CEO_NAME"]
          ceo_email = os.environ["CEO_EMAIL"]
          user_password = os.environ["USER_PASSWORD"]
          tenant = os.environ["TENANT"]
          tenant_url = f"https://{tenant}.app.ai-harness.com"

          token_body = urllib.parse.urlencode(
              {
                  "client_id": cid,
                  "client_secret": sec,
                  "scope": "https://graph.microsoft.com/.default",
                  "grant_type": "client_credentials",
              }
          ).encode("utf-8")
          token_req = urllib.request.Request(
              f"https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token",
              data=token_body,
              method="POST",
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          try:
              t_status, tok = http_json(token_req)
          except urllib.error.HTTPError as e:
              err = e.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Graph token HTTP {e.code}: {err[:4000]}") from None
          if t_status != 200:
              raise SystemExit(f"Graph token unexpected status {t_status}: {tok}")
          access = tok.get("access_token")
          if not access:
              raise SystemExit(f"Graph token missing access_token: {json.dumps(tok)[:2000]}")

          body = "\n".join(
              [
                  f"Hi {ceo_name},",
                  "",
                  f"Your AI-Harness tenant ({tenant}) is ready.",
                  "",
                  "You can sign in at:",
                  tenant_url,
                  "",
                  "Your initial login credentials are:",
                  f"- Email: {ceo_email}",
                  f"- Password: {user_password}",
                  "",
                  "For security, please sign in and change your password as soon as possible.",
                  "",
                  "Thanks,",
                  "AI-Harness Support",
              ]
          )
          msg = {
              "message": {
                  "subject": "Your AI-Harness access is ready",
                  "body": {"contentType": "Text", "content": body},
                  "toRecipients": [{"emailAddress": {"address": ceo_email}}],
              },
              "saveToSentItems": True,
          }
          enc = urllib.parse.quote(sender, safe="")
          send_req = urllib.request.Request(
              f"https://graph.microsoft.com/v1.0/users/{enc}/sendMail",
              data=json.dumps(msg).encode("utf-8"),
              method="POST",
              headers={"Authorization": f"Bearer {access}", "Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(send_req, context=ctx) as r2:
                  if r2.status != 202:
                      text = r2.read().decode("utf-8", errors="replace")
                      raise SystemExit(f"sendMail expected 202, got {r2.status}: {text[:4000]}")
          except urllib.error.HTTPError as e:
              err = e.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Graph sendMail HTTP {e.code}: {err[:4000]}") from None
          PY
