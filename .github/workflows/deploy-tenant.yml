name: Deploy Tenant

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name (used in namespace and host)"
        required: true
        type: string
      imageTag:
        description: "Image tag to deploy (dd.mm.yyyy.N)"
        required: true
        type: string
      createNamespace:
        description: "Create namespace if it does not exist"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  IMAGE_NAME: ai-harness

jobs:
  deploy-tenant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract ACR name from login server
        id: acr
        run: |
          LOGIN_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${LOGIN_SERVER%%.*}"
          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve image tag and validate
        id: tag
        run: |
          IMAGE_TAG="${{ github.event.inputs.imageTag }}"
          ACR_NAME="${{ steps.acr.outputs.acr_name }}"

          echo "Using provided image tag: ${IMAGE_TAG}"

          EXISTS=$(az acr repository show-tags \
            -n "${ACR_NAME}" \
            --repository "${IMAGE_NAME}" \
            --query "[?@=='${IMAGE_TAG}']|length(@)" -o tsv 2>/dev/null || echo 0)

          if [ "${EXISTS}" -eq 0 ]; then
            echo "ERROR: Tag '${IMAGE_TAG}' does not exist in ACR for repository '${IMAGE_NAME}'."
            exit 1
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER_NAME }}

      - name: Ensure DNS A record for tenant
        env:
          AZURE_AKS_RESOURCE_GROUP: ${{ secrets.AZURE_AKS_RESOURCE_GROUP }}
          AZURE_DNS_ZONE: ${{ secrets.AZURE_DNS_ZONE }}
        run: |
          set -e
          TENANT="${{ github.event.inputs.tenant }}"
          HOST="${TENANT}.ai-harness.com"
          ZONE="${AZURE_DNS_ZONE:-ai-harness.com}"
          RG="${AZURE_AKS_RESOURCE_GROUP}"
          # Record name is the subdomain (e.g. "mytenant" for mytenant.ai-harness.com)
          RECORD_NAME="${TENANT}"

          echo "Getting Traefik LoadBalancer public IP from cluster (namespace traefik)..."
          TRAEFIK_IP=$(kubectl get svc -n traefik -o jsonpath='{.items[?(@.spec.type=="LoadBalancer")].status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          if [ -z "$TRAEFIK_IP" ]; then
            TRAEFIK_IP=$(kubectl get svc -n traefik -o jsonpath='{.items[?(@.spec.type=="LoadBalancer")].status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          fi
          if [ -z "$TRAEFIK_IP" ]; then
            echo "ERROR: Could not get Traefik LoadBalancer IP from traefik namespace. Ensure Traefik is installed and has a LoadBalancer service."
            exit 1
          fi
          echo "Traefik public IP: ${TRAEFIK_IP}"

          echo "Checking if A record '${RECORD_NAME}' exists in zone '${ZONE}' (resource group '${RG}')..."
          if az network dns record-set a show \
            --resource-group "${RG}" \
            --zone-name "${ZONE}" \
            --name "${RECORD_NAME}" \
            --query "name" -o tsv 2>/dev/null; then
            echo "A record '${RECORD_NAME}' already exists; ensuring it points to ${TRAEFIK_IP}..."
            # Get current IPs and add/update so the LB IP is present
            CURRENT_IPS=$(az network dns record-set a list-records \
              --resource-group "${RG}" \
              --zone-name "${ZONE}" \
              --name "${RECORD_NAME}" \
              --query "[].ipv4Address" -o tsv 2>/dev/null || true)
            if echo "$CURRENT_IPS" | grep -q "^${TRAEFIK_IP}$"; then
              echo "Record already points to ${TRAEFIK_IP}. No change needed."
            else
              # Remove existing records and add the Traefik IP (Azure CLI doesn't have a simple "set single A")
              for ip in $CURRENT_IPS; do
                az network dns record-set a remove-record \
                  --resource-group "${RG}" \
                  --zone-name "${ZONE}" \
                  --name "${RECORD_NAME}" \
                  --ipv4-address "${ip}" 2>/dev/null || true
              done
              az network dns record-set a add-record \
                --resource-group "${RG}" \
                --zone-name "${ZONE}" \
                --name "${RECORD_NAME}" \
                --ipv4-address "${TRAEFIK_IP}"
              echo "Updated A record '${RECORD_NAME}' to ${TRAEFIK_IP}."
            fi
          else
            echo "A record '${RECORD_NAME}' not found. Creating record set and adding A record..."
            az network dns record-set a create \
              --resource-group "${RG}" \
              --zone-name "${ZONE}" \
              --name "${RECORD_NAME}" \
              --ttl 300
            az network dns record-set a add-record \
              --resource-group "${RG}" \
              --zone-name "${ZONE}" \
              --name "${RECORD_NAME}" \
              --ipv4-address "${TRAEFIK_IP}"
            echo "Created A record '${RECORD_NAME}' -> ${TRAEFIK_IP}."
          fi
          echo "DNS: ${HOST} -> ${TRAEFIK_IP}"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy tenant with Helm
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          IMAGE_TAG="${{ steps.tag.outputs.image_tag }}"
          CREATE_NS="${{ github.event.inputs.createNamespace }}"

          NAMESPACE="ai-harness-${TENANT}"
          RELEASE_NAME="ai-harness-${TENANT}"
          HOST="${TENANT}.ai-harness.com"

          if [ "${CREATE_NS}" = "true" ]; then
            kubectl get ns "${NAMESPACE}" >/dev/null 2>&1 || kubectl create ns "${NAMESPACE}"
          fi

          helm upgrade --install "${RELEASE_NAME}" ./helm \
            --namespace "${NAMESPACE}" \
            --set fullnameOverride="${RELEASE_NAME}" \
            --set server.image.repository="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}" \
            --set server.image.tag="${IMAGE_TAG}" \
            --set server.image.pullPolicy=IfNotPresent \
            --set server.extraEnv.IMAGE_TAG="${IMAGE_TAG}" \
            --set server.paperclip.instanceId="${TENANT}" \
            --set server.paperclip.publicUrl="https://${HOST}" \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host="${HOST}" \
            --set ingress.hosts[0].paths[0].path="/" \
            --set ingress.hosts[0].paths[0].pathType="Prefix" \
            --set ingress.tls[0].hosts[0]="${HOST}"

      - name: Capture CEO invite URL from logs
        id: capture_invite
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          NAMESPACE="ai-harness-${TENANT}"
          RELEASE_NAME="ai-harness-${TENANT}"

          echo "Attempting to capture CEO invite URL from server logs for tenant '${TENANT}'..."
          # Wait for rollout (handles slow image pulls / startup)
          kubectl rollout status deployment/${RELEASE_NAME}-server -n "${NAMESPACE}" --timeout=300s || echo "Warning: rollout did not complete within timeout; continuing to check logs."

          INVITE_LINE=""
          # Retry a few times in case bootstrap runs slightly after readiness
          for i in $(seq 1 5); do
            echo "Attempt ${i} to find invite URL in logs..."
            INVITE_LINE=$(kubectl logs deployment/${RELEASE_NAME}-server -n "${NAMESPACE}" --tail=500 | grep -m1 'Invite URL:' || true)
            if [ -n "$INVITE_LINE" ]; then
              break
            fi
            sleep 15
          done

          if [ -z "$INVITE_LINE" ]; then
            echo "No invite URL found in recent logs. This likely means the CEO was already bootstrapped previously."
            echo "invite_url=" >> "$GITHUB_OUTPUT"
            {
              echo "## Paperclip Tenant CEO Invite"
              echo ""
              echo "- No new invite URL found in recent logs for tenant '${TENANT}'."
              echo "- This usually means the CEO was already bootstrapped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          INVITE_URL=$(echo "$INVITE_LINE" | awk '{print $NF}')
          echo "Found invite URL: $INVITE_URL"
          echo "invite_url=${INVITE_URL}" >> "$GITHUB_OUTPUT"

          {
            echo "## Paperclip Tenant CEO Invite"
            echo ""
            echo "A new CEO invite URL was created during this deployment for tenant '${TENANT}':"
            echo ""
            echo "  ${INVITE_URL}"
            echo ""
            echo "_Note: This URL is typically single-use and time-limited. Share it only with the intended recipient._"
          } >> "$GITHUB_STEP_SUMMARY"

