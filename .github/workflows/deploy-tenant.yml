name: Deploy Tenant

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name (used in namespace and host)"
        required: true
        type: string
      userName:
        description: "Default CEO user full name"
        required: true
        type: string
      userEmail:
        description: "Default CEO user email"
        required: true
        type: string
      imageTag:
        description: "Image tag to deploy (dd.mm.yyyy.N)"
        required: true
        type: string
      createNamespace:
        description: "Create namespace if it does not exist"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  IMAGE_NAME: ai-harness

jobs:
  deploy-tenant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract ACR name from login server
        id: acr
        run: |
          LOGIN_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${LOGIN_SERVER%%.*}"
          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve image tag and validate
        id: tag
        run: |
          IMAGE_TAG="${{ github.event.inputs.imageTag }}"
          ACR_NAME="${{ steps.acr.outputs.acr_name }}"

          echo "Using provided image tag: ${IMAGE_TAG}"

          EXISTS=$(az acr repository show-tags \
            -n "${ACR_NAME}" \
            --repository "${IMAGE_NAME}" \
            --query "[?@=='${IMAGE_TAG}']|length(@)" -o tsv 2>/dev/null || echo 0)

          if [ "${EXISTS}" -eq 0 ]; then
            echo "ERROR: Tag '${IMAGE_TAG}' does not exist in ACR for repository '${IMAGE_NAME}'."
            exit 1
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Create tenant database on shared Azure PostgreSQL
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          DB_NAME="ai-harness-${TENANT}"

          echo "Creating database '${DB_NAME}' on shared Azure PostgreSQL instance..."
          az postgres flexible-server db create \
            --resource-group "${{ secrets.AZURE_POSTGRES_RG }}" \
            --server-name   "${{ secrets.AZURE_POSTGRES_SERVER }}" \
            --database-name "${DB_NAME}" \
            2>&1 | grep -v "already exists" || true

          echo "Database '${DB_NAME}' is ready."

      - name: Deploy tenant with Helm
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          IMAGE_TAG="${{ steps.tag.outputs.image_tag }}"
          CREATE_NS="${{ github.event.inputs.createNamespace }}"

          NAMESPACE="ai-harness-${TENANT}"
          RELEASE_NAME="ai-harness-${TENANT}"
          HOST="${TENANT}.app.ai-harness.com"
          DB_NAME="ai-harness-${TENANT}"

          # Build connection string for the tenant's database on the shared instance
          # Azure PostgreSQL Flexible Server requires sslmode=require
          DATABASE_URL="postgresql://${{ secrets.AZURE_POSTGRES_USER }}:${{ secrets.AZURE_POSTGRES_PASSWORD }}@${{ secrets.AZURE_POSTGRES_HOST }}:5432/${DB_NAME}?sslmode=require"

          if [ "${CREATE_NS}" = "true" ]; then
            kubectl get ns "${NAMESPACE}" >/dev/null 2>&1 || kubectl create ns "${NAMESPACE}"
          fi

          helm upgrade --install "${RELEASE_NAME}" ./helm \
            --namespace "${NAMESPACE}" \
            --set fullnameOverride="${RELEASE_NAME}" \
            --set postgres.enabled=false \
            --set server.image.repository="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}" \
            --set server.image.tag="${IMAGE_TAG}" \
            --set server.image.pullPolicy=IfNotPresent \
            --set server.extraEnv.IMAGE_TAG="${IMAGE_TAG}" \
            --set server.paperclip.instanceId="${TENANT}" \
            --set server.paperclip.publicUrl="https://${HOST}" \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host="${HOST}" \
            --set ingress.hosts[0].paths[0].path="/" \
            --set ingress.hosts[0].paths[0].pathType="Prefix" \
            --set ingress.tls[0].hosts[0]="${HOST}" \
            --set ingress.tls[0].secretName="app-ai-harness-tls" \
            --set-string server.database.externalUrl="${DATABASE_URL}" \
            --set-string server.secrets.betterAuthSecret="${{ secrets.BETTER_AUTH_SECRET }}" \
            --set-string server.paperclip.openaiApiKey="${{ secrets.OPENAI_API_KEY }}"

      - name: Capture CEO invite URL from logs
        id: capture_invite
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          NAMESPACE="ai-harness-${TENANT}"
          RELEASE_NAME="ai-harness-${TENANT}"

          echo "Attempting to capture CEO invite URL from server logs for tenant '${TENANT}'..."
          # Wait for rollout (handles slow image pulls / startup)
          kubectl rollout status deployment/${RELEASE_NAME}-server -n "${NAMESPACE}" --timeout=300s || echo "Warning: rollout did not complete within timeout; continuing to check logs."

          INVITE_LINE=""
          # Retry a few times in case bootstrap runs slightly after readiness
          for i in $(seq 1 5); do
            echo "Attempt ${i} to find invite URL in logs..."
            INVITE_LINE=$(kubectl logs deployment/${RELEASE_NAME}-server -n "${NAMESPACE}" --tail=500 | grep -m1 'Invite URL:' || true)
            if [ -n "$INVITE_LINE" ]; then
              break
            fi
            sleep 15
          done

          if [ -z "$INVITE_LINE" ]; then
            echo "No invite URL found in recent logs. This likely means the CEO was already bootstrapped previously."
            echo "invite_url=" >> "$GITHUB_OUTPUT"
            {
              echo "## Paperclip Tenant CEO Invite"
              echo ""
              echo "- No new invite URL found in recent logs for tenant '${TENANT}'."
              echo "- This usually means the CEO was already bootstrapped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          INVITE_URL=$(echo "$INVITE_LINE" | awk '{print $NF}')
          echo "Found invite URL: $INVITE_URL"
          echo "invite_url=${INVITE_URL}" >> "$GITHUB_OUTPUT"

          {
            echo "## Paperclip Tenant CEO Invite"
            echo ""
            echo "A new CEO invite URL was created during this deployment for tenant '${TENANT}':"
            echo ""
            echo "  ${INVITE_URL}"
            echo ""
            echo "_Note: This URL is typically single-use and time-limited. Share it only with the intended recipient._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-bootstrap CEO user and accept invite
        id: bootstrap_ceo
        if: steps.capture_invite.outputs.invite_url != ''
        run: |
          set -euo pipefail

          TENANT="${{ github.event.inputs.tenant }}"
          HOST="${TENANT}.app.ai-harness.com"
          BASE_URL="https://${HOST}"

          USER_NAME="${{ github.event.inputs.userName }}"
          USER_EMAIL="${{ github.event.inputs.userEmail }}"
          # Generate a random 24-char base64 password
          USER_PASSWORD="$(openssl rand -base64 18)"

          INVITE_URL="${{ steps.capture_invite.outputs.invite_url }}"
          INVITE_TOKEN="${INVITE_URL##*/}"

          echo "Using invite URL: ${INVITE_URL}"
          echo "Bootstrapping CEO user ${USER_EMAIL} at ${BASE_URL}"

          TMP_DIR="$(mktemp -d)"
          COOKIE_JAR="$TMP_DIR/cookies.txt"

          post_json_with_cookies() {
            local url="$1"
            local body="$2"
            local output_file="$3"
            curl -sS \
              -o "$output_file" \
              -w "%{http_code}" \
              -c "$COOKIE_JAR" \
              -b "$COOKIE_JAR" \
              -H "Content-Type: application/json" \
              -H "Origin: $BASE_URL" \
              -X POST \
              "$url" \
              --data "$body"
          }

          # 1) Sign up or sign in the CEO user
          SIGNUP_RESP="$TMP_DIR/signup.json"
          SIGNUP_STATUS="$(post_json_with_cookies \
            "$BASE_URL/api/auth/sign-up/email" \
            "{\"name\":\"$USER_NAME\",\"email\":\"$USER_EMAIL\",\"password\":\"$USER_PASSWORD\"}" \
            "$SIGNUP_RESP")"

          if [[ "$SIGNUP_STATUS" =~ ^2 ]]; then
            echo "Created CEO user ${USER_EMAIL}"
          else
            SIGNIN_RESP="$TMP_DIR/signin.json"
            SIGNIN_STATUS="$(post_json_with_cookies \
              "$BASE_URL/api/auth/sign-in/email" \
              "{\"email\":\"$USER_EMAIL\",\"password\":\"$USER_PASSWORD\"}" \
              "$SIGNIN_RESP")"

            if [[ "$SIGNIN_STATUS" =~ ^2 ]]; then
              echo "Signed in existing CEO user ${USER_EMAIL}"
            else
              echo "Failed to sign up or sign in CEO user" >&2
              echo "Sign-up response:" >&2
              cat "$SIGNUP_RESP" || true
              echo >&2
              echo "Sign-in response:" >&2
              cat "$SIGNIN_RESP" || true
              exit 1
            fi
          fi

          echo "Authenticated as ${USER_EMAIL}, accepting invite..."

          # 2) Accept the invite as this user
          ACCEPT_RESP="$TMP_DIR/accept.json"
          ACCEPT_STATUS="$(post_json_with_cookies \
            "$BASE_URL/api/invites/$INVITE_TOKEN/accept" \
            '{"requestType":"human"}' \
            "$ACCEPT_RESP")"

          if ! [[ "$ACCEPT_STATUS" =~ ^2 ]]; then
            echo "Failed to accept invite (HTTP $ACCEPT_STATUS)" >&2
            cat "$ACCEPT_RESP" || true
            exit 1
          fi

          echo "CEO invite accepted automatically for ${USER_EMAIL}"
          echo "CEO login details:"
          echo "  Email: ${USER_EMAIL}"
          echo "  Password: ${USER_PASSWORD}"

          echo "user_password=${USER_PASSWORD}" >> "$GITHUB_OUTPUT"

      - name: Send CEO credentials email
        if: steps.capture_invite.outputs.invite_url != ''
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.agentmail.to
          server_port: 465
          secure: true
          username: "support@ai-harness.com"
          password: ${{ secrets.SMTP_PASSWORD }}
          from: "AI-Harness Support <support@ai-harness.com>"
          to: ${{ github.event.inputs.userEmail }}
          subject: "Your AI-Harness access is ready"
          body: |
            Hi ${{ github.event.inputs.userName }},

            Your AI-Harness tenant (${{ github.event.inputs.tenant }}) is ready.

            You can sign in at:
            https://${{ github.event.inputs.tenant }}.app.ai-harness.com

            Your initial login credentials are:
            - Email: ${{ github.event.inputs.userEmail }}
            - Password: ${{ steps.bootstrap_ceo.outputs.user_password }}

            For security, please sign in and change your password as soon as possible.

            Thanks,
            AI-Harness Support

