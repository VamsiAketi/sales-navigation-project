services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://paperclip:paperclip@db:5432/paperclip
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - paperclip-data:/paperclip
      - ./bootstrap-output:/bootstrap-output 
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c '
      if [ ! -f "${PAPERCLIP_CONFIG:-/paperclip/instances/default/config.json}" ]; then
        echo "=== ONBOARDING PAPERCLIP INSTANCE ===";
        pnpm paperclipai onboard --yes;
        echo "=== STARTING SERVER FOR BOOTSTRAP ===";
        pnpm --filter @paperclipai/server dev &
        echo "Waiting for server (max 60s)...";
        ATTEMPTS=0;
        until curl -sf http://localhost:3100/api/health > /dev/null 2>&1; do
          ATTEMPTS=$((ATTEMPTS + 1));
          if [ "$ATTEMPTS" -ge 30 ]; then
            echo "Server did not become healthy within 60s, aborting bootstrap.";
            exit 1;
          fi;
          echo "Waiting for server... (${ATTEMPTS}/30)";
          sleep 2;
        done;
        echo "=== BOOTSTRAPPING ADMIN (CEO) ===";
        pnpm paperclipai auth bootstrap-ceo --data-dir /paperclip --base-url "http://localhost:3100";
        echo "=== BOOTSTRAP DONE ===";
        wait;
      else
        echo "Config ${PAPERCLIP_CONFIG:-/paperclip/instances/default/config.json} exists; skipping onboarding/bootstrap.";
        pnpm --filter @paperclipai/server dev;
      fi
      '
volumes:
  pgdata:
  paperclip-data:
